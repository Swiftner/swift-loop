<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Swift Loop — live preview</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #eceef1;
        --panel: #ffffff;
        --ink: #15161a;
        --ink-2: #4b4d56;
        --muted: #8a8d97;
        --hair: #e7e8ec;
        --hair-2: #d8dade;
        --accent: #6e5bff;
        --accent-2: #8b7bff;
        --accent-ink: #2a1f8f;
        --accent-tint: rgba(110, 91, 255, 0.10);
        --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      html, body {
        margin: 0;
        height: 100%;
        background:
          radial-gradient(1200px 600px at 110% -10%, rgba(110, 91, 255, 0.07), transparent 60%),
          radial-gradient(900px 500px at -10% 110%, rgba(110, 91, 255, 0.05), transparent 55%),
          var(--bg);
        font: 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--ink);
      }
      .layout {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 16px;
        padding: 16px;
        height: 100vh;
        box-sizing: border-box;
      }

      /* ---------- Panel ---------- */
      .panel {
        background: var(--panel);
        border-radius: 12px;
        box-shadow:
          0 1px 0 rgba(255,255,255,.8) inset,
          0 1px 2px rgba(20, 22, 28, 0.04),
          0 12px 32px -16px rgba(20, 22, 28, 0.18);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(20, 22, 28, 0.04);
      }
      .panel-title {
        padding: 10px 12px;
        border-bottom: 1px solid var(--hair);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: linear-gradient(180deg, #fbfbfd 0%, #ffffff 100%);
      }

      /* ---------- Panel tag (replaces "Plugin UI" / "Preview" labels) ---------- */
      .panel-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: var(--mono);
        font-weight: 500;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink);
      }
      .panel-tag .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-tint);
        animation: dot-pulse 2.4s ease-in-out infinite;
      }
      .panel-tag .slash {
        color: var(--muted);
        font-weight: 400;
        margin: 0 -2px;
      }
      .panel-tag .sub {
        color: var(--ink-2);
        letter-spacing: 0.12em;
      }
      .panel-tag .meta {
        margin-left: 6px;
        padding-left: 8px;
        border-left: 1px solid var(--hair);
        color: var(--muted);
        font-feature-settings: "tnum";
        letter-spacing: 0.08em;
        text-transform: none;
      }
      @keyframes dot-pulse {
        0%, 100% { box-shadow: 0 0 0 3px var(--accent-tint); }
        50% { box-shadow: 0 0 0 5px rgba(110, 91, 255, 0.06); }
      }

      /* ---------- Primary CTA (Get plugin .zip) ---------- */
      .btn-primary {
        display: inline-flex;
        align-items: stretch;
        padding: 0;
        background: var(--accent);
        color: #fff;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 500;
        font-size: 12px;
        line-height: 1;
        letter-spacing: 0;
        box-shadow: none;
        transition: background 120ms ease;
        overflow: hidden;
      }
      .btn-primary:hover { background: #5d4afc; }
      .btn-primary:active { background: #5141e8; }
      .btn-primary .label {
        padding: 8px 4px 8px 12px;
      }
      .btn-primary .chip {
        padding: 8px 10px 8px 4px;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.7);
      }
      .btn-primary .arrow {
        display: inline-flex;
        align-items: center;
        padding: 0 12px;
        background: rgba(0, 0, 0, 0.14);
      }
      .btn-primary .arrow svg {
        transition: transform 200ms cubic-bezier(.2,.7,.2,1);
      }
      .btn-primary:hover .arrow svg { transform: translateY(1px); }

      /* ---------- Iframe & preview stage ---------- */
      iframe#plugin-ui {
        flex: 1 1 auto;
        width: 100%;
        border: 0;
        background: #fff;
      }
      .preview-stage {
        flex: 1 1 auto;
        position: relative;
        background:
          linear-gradient(45deg, #f3f4f7 25%, transparent 25%) 0 0 / 16px 16px,
          linear-gradient(-45deg, #f3f4f7 25%, transparent 25%) 0 8px / 16px 16px,
          linear-gradient(45deg, transparent 75%, #f3f4f7 75%) 8px -8px / 16px 16px,
          linear-gradient(-45deg, transparent 75%, #f3f4f7 75%) 8px 0 / 16px 16px,
          #fff;
        overflow: auto;
      }
      svg#preview { display: block; margin: 0 auto; }
      .preview-stage.is-drop {
        outline: 2px dashed var(--accent);
        outline-offset: -8px;
      }

      /* ---------- Controls (footer) ---------- */
      .controls {
        padding: 10px 12px;
        border-top: 1px solid var(--hair);
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        background: linear-gradient(180deg, #ffffff 0%, #fbfbfd 100%);
      }
      .ctrl-group {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .ctrl-divider {
        width: 1px;
        height: 18px;
        background: var(--hair);
      }

      /* Ghost button — quiet, refined */
      .btn-ghost {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        background: #fff;
        border: 1px solid var(--hair-2);
        border-radius: 6px;
        color: var(--ink);
        font: 500 11.5px/1 system-ui, sans-serif;
        cursor: pointer;
        transition: background 120ms ease, border-color 120ms ease, transform 120ms ease, box-shadow 120ms ease;
      }
      .btn-ghost:hover {
        background: #fafafc;
        border-color: #c4c7cd;
        box-shadow: 0 1px 2px rgba(20, 22, 28, 0.04);
      }
      .btn-ghost:active { transform: translateY(0.5px); }
      .btn-ghost svg { color: var(--ink-2); }

      /* Accent ghost — used for Download SVG (primary action in footer) */
      .btn-ghost.is-accent {
        background: var(--accent-tint);
        border-color: rgba(110, 91, 255, 0.22);
        color: var(--accent-ink);
      }
      .btn-ghost.is-accent svg { color: var(--accent); }
      .btn-ghost.is-accent:hover {
        background: rgba(110, 91, 255, 0.16);
        border-color: rgba(110, 91, 255, 0.32);
      }

      /* Shape pill — mono key/value tag */
      .shape-pill {
        display: inline-flex;
        align-items: center;
        gap: 0;
        padding: 0;
        background: #f4f5f7;
        border: 1px solid var(--hair);
        border-radius: 6px;
        overflow: hidden;
        font-family: var(--mono);
        font-size: 10.5px;
        line-height: 1;
      }
      .shape-pill .key {
        padding: 6px 8px;
        background: #ecedf0;
        color: var(--muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 9.5px;
        font-weight: 500;
        border-right: 1px solid var(--hair);
      }
      .shape-pill .val {
        padding: 6px 8px;
        color: var(--ink);
        font-weight: 500;
      }
      .shape-pill .shape-clear {
        padding: 0 8px;
        height: 100%;
        align-self: stretch;
        background: transparent;
        border: 0;
        border-left: 1px solid var(--hair);
        color: var(--muted);
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
        transition: color 120ms ease, background 120ms ease;
      }
      .shape-pill .shape-clear:hover {
        color: #d63a1a;
        background: #fef2ef;
      }
      .keep-colors {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
      }
      .keep-colors input {
        margin: 0;
        accent-color: #6e5bff;
      }

      /* ---------- Attribution ---------- */
      .attribution {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .attribution a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        margin-right: -4px;
        color: inherit;
        text-decoration: none;
        border-radius: 5px;
        transition: background 150ms ease, transform 150ms ease;
      }
      .attribution a:hover {
        background: var(--accent-tint);
        transform: translateY(-0.5px);
      }
      .attribution img {
        height: 13px;
        width: auto;
        display: block;
      }
      .attribution svg {
        display: block;
      }
      .attribution-sep {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="panel">
        <div class="panel-title">
          <span class="panel-tag" aria-label="Plugin UI">
            <span class="dot" aria-hidden="true"></span>
            Plugin <span class="slash">/</span> <span class="sub">UI</span>
          </span>
          <a
            class="btn-primary"
            href="https://github.com/Swiftner/swift-loop/releases/latest/download/swift-loop-latest.zip"
            title="Download the latest Figma plugin .zip"
          >
            <span class="label">Get plugin</span>
            <span class="chip">.zip</span>
            <span class="arrow" aria-hidden="true">
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
                <path d="M5.5 1.5v6.5m0 0L2.75 5.25M5.5 8L8.25 5.25M2 9.5h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </a>
        </div>
        <!-- No sandbox: allow-scripts + allow-same-origin together effectively
             removes the sandbox anyway, and we need both for postMessage and
             localStorage to work. -->
        <iframe id="plugin-ui" src="./preview-ui.html"></iframe>
      </div>
      <div class="panel">
        <div class="panel-title">
          <span class="panel-tag">
            <span class="dot" aria-hidden="true"></span>
            Preview
            <span class="meta" id="preview-status">—</span>
          </span>
        </div>
        <div class="preview-stage">
          <svg id="preview" width="640" height="520" viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg">
            <g id="preview-layer"></g>
          </svg>
        </div>
        <div class="controls">
          <div class="ctrl-group">
            <label class="btn-ghost" for="shape-upload" title="Upload an SVG or PNG to replace the circle">
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true">
                <path d="M5.5 9.5V2m0 0L2.75 4.75M5.5 2l2.75 2.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Upload shape
            </label>
            <input id="shape-upload" type="file" accept=".svg,image/svg+xml,image/png,image/jpeg,image/webp" hidden />
            <span class="shape-pill" title="Current shape">
              <span class="key">shape</span>
              <span class="val"><span id="shape-label">circle (default)</span></span>
              <button id="shape-clear" class="shape-clear" type="button" title="Reset to circle" hidden aria-label="Reset to circle">×</button>
            </span>
            <label id="keep-colors-wrap" class="keep-colors" hidden title="Use the uploaded SVG's own fill and stroke instead of the loop's color controls">
              <input id="keep-colors" type="checkbox" />
              <span>Keep original colors</span>
            </label>
          </div>
          <div class="ctrl-divider" aria-hidden="true"></div>
          <div class="ctrl-group">
            <button id="download-svg" class="btn-ghost is-accent" type="button" title="Download the current preview as SVG">
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true">
                <path d="M5.5 1.5v6.5m0 0L2.75 5.25M5.5 8L8.25 5.25M2 9.5h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Download SVG
            </button>
            <button id="reset-btn" class="btn-ghost" type="button" title="Reload the page">
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true">
                <path d="M9 5.5a3.5 3.5 0 1 1-1.03-2.47M9 2v2.5H6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Reload
            </button>
          </div>
          <span class="attribution">
            <a href="https://github.com/Swiftner/swift-loop" target="_blank" rel="noreferrer" title="View source on GitHub">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
              </svg>
              GitHub
            </a>
            <span class="attribution-sep" aria-hidden="true">·</span>
            made by
            <a href="https://swiftner.com" target="_blank" rel="noreferrer">
              <img src="./swiftner-logo.png" alt="Swiftner" />
            </a>
          </span>
        </div>
      </div>
    </div>
    <script src="./build/preview.js"></script>
    <script>
      document.getElementById('reset-btn').addEventListener('click', () => location.reload());
    </script>
  </body>
</html>

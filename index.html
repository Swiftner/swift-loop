<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Swift Loop — live preview</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html, body { margin: 0; height: 100%; background: #f0f1f3; font: 12px system-ui, sans-serif; color: #222; }
      body { display: flex; flex-direction: column; min-height: 100vh; }
      .layout {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 16px;
        padding: 16px;
        flex: 1 1 auto;
        min-height: 0;
        box-sizing: border-box;
      }
      .attribution {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px 16px 18px;
        color: #6a6a72;
        font-size: 11px;
        letter-spacing: 0.02em;
      }
      .attribution a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: inherit;
        text-decoration: none;
        transition: opacity 150ms ease;
      }
      .attribution a:hover { opacity: 0.7; }
      .attribution img {
        height: 16px;
        width: auto;
        display: block;
      }
      .panel {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 10px rgba(0,0,0,.06);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .panel-title {
        padding: 8px 12px;
        border-bottom: 1px solid #eee;
        font-weight: 600;
        color: #555;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .panel-title small { font-weight: 400; color: #888; font-feature-settings: "tnum"; }
      .panel-title a.download {
        font-weight: 500;
        color: #18a0fb;
        text-decoration: none;
        border: 1px solid #cfe9ff;
        background: #f1f8ff;
        padding: 2px 8px;
        border-radius: 4px;
      }
      .panel-title a.download:hover { background: #e5f3ff; }
      iframe#plugin-ui {
        flex: 1 1 auto;
        width: 100%;
        border: 0;
        background: #fff;
      }
      .preview-stage {
        flex: 1 1 auto;
        position: relative;
        background:
          linear-gradient(45deg, #f6f7f9 25%, transparent 25%) 0 0 / 16px 16px,
          linear-gradient(-45deg, #f6f7f9 25%, transparent 25%) 0 8px / 16px 16px,
          linear-gradient(45deg, transparent 75%, #f6f7f9 75%) 8px -8px / 16px 16px,
          linear-gradient(-45deg, transparent 75%, #f6f7f9 75%) 8px 0 / 16px 16px,
          #fff;
        overflow: auto;
      }
      svg#preview {
        display: block;
        margin: 0 auto;
      }
      .controls {
        padding: 8px 12px;
        border-top: 1px solid #eee;
        display: flex;
        gap: 8px;
        align-items: center;
        color: #666;
      }
      .controls button {
        padding: 4px 10px;
        background: #f3f4f6;
        border: 1px solid #d8dade;
        border-radius: 4px;
        cursor: pointer;
        font: inherit;
      }
      .controls button:hover { background: #e9eaee; }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="panel">
        <div class="panel-title">
          Plugin UI
          <a
            class="download"
            href="https://github.com/Swiftner/swift-loop/releases/latest/download/swift-loop-latest.zip"
            title="Download the most recent plugin build"
          >Download ↓</a>
        </div>
        <!-- No sandbox: allow-scripts + allow-same-origin together effectively
             removes the sandbox anyway, and we need both for postMessage and
             localStorage to work. -->
        <iframe id="plugin-ui" src="./preview-ui.html"></iframe>
      </div>
      <div class="panel">
        <div class="panel-title">Preview <small id="preview-status">—</small></div>
        <div class="preview-stage">
          <svg id="preview" width="640" height="520" viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg">
            <g id="preview-layer"></g>
          </svg>
        </div>
        <div class="controls">
          <button id="reset-btn" type="button">Reset source</button>
          <span>Dashed circle = source; filled = clones. Drag any control to see it react.</span>
        </div>
      </div>
    </div>
    <footer class="attribution">
      <span>made by</span>
      <a href="https://swiftner.com" target="_blank" rel="noreferrer">
        <img src="./swiftner-logo.png" alt="Swiftner" />
      </a>
    </footer>
    <script src="./build/preview.js"></script>
    <script>
      document.getElementById('reset-btn').addEventListener('click', () => location.reload());
    </script>
  </body>
</html>

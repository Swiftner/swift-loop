name: Validate library

on:
  pull_request:
    paths:
      - 'library/**'
      - 'src/plugin/engine/**'
      - 'tests/library.test.ts'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - run: bun run test library
